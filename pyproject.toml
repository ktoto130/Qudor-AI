[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="qudor-ai"
version="2.0.0"
requires-python=">=3.10"
dependencies=["numpy>=1.26","torch>=2.2","pandas>=2.1","matplotlib>=3.8","psutil>=5.9"]
[project.optional-dependencies]
dev=["pytest>=8"]
[tool.setuptools.packages.find]
include=["quoridor_ai*"]
[tool.pytest.ini_options]
testpaths=["tests"]
